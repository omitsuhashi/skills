schema_version = 1

[families.repository-change-loop]
description = "Repository change workflow skills that move work from requirements through specification, planning, and local implementation."
user_facing_skills = ["sdd-implementation"]
default_implementation_skill = "sdd-implementation"
first_entry_skill = "sdd-implementation"
pre_gate_writable_subskill_action = "blocked"
downstream_conflict_action = "blocked"
guard_activation_owner = "separate_human_authorized_setup"
forbidden_standalone_skill_names = [
  "context-manager",
  "dependency-graph",
  "execution-envelope",
  "human-wait",
  "remote-delivery",
  "review-gate",
  "runtime-state",
  "scheduler",
  "worker-contract",
  "worktree-lifecycle",
]
internal_components = [
  "context contracts",
  "context compaction",
  "dependency graph",
  "execution envelope",
  "human wait routing",
  "remote delivery",
  "review gate",
  "runtime state",
  "scheduler",
  "worker contract",
  "worktree lifecycle",
]

[families.repository-change-loop.planning_authority]
integration_owner = "main_planning_context"
supporting_agent_authority = "advisory_only"
decision_authority = "human"
model_selection = "host_runtime"
model_persistence = "forbidden"
