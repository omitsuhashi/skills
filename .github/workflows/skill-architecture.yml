name: Skill Architecture

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate skill architecture
        run: PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 scripts/validate_skill_architecture.py --all

      - name: Validate skill context
        run: PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 scripts/validate_skill_context.py --all

      - name: Test skill authoring guidance
        run: PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 scripts/test_skill_authoring_guidance.py

      - name: Test skill CI workflow contract
        run: PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 scripts/test_skill_ci_workflow.py

      - name: Test SDD transient artifact validator
        run: PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 scripts/test_validate_sdd_transient_artifacts.py

      - name: Validate SDD transient artifacts
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git write-tree)"
          PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 scripts/validate_sdd_transient_artifacts.py \
            --post-policy-history \
            --candidate-tree "$candidate_tree" \
            --final-tree HEAD

      - name: Write context report
        run: |
          mkdir -p .artifacts
          PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 scripts/report_skill_context.py --all --json --fail-on-warning > .artifacts/skill-context-report.json
          python3 -m json.tool .artifacts/skill-context-report.json > /tmp/skill-context-report.pretty.json
          mv /tmp/skill-context-report.pretty.json .artifacts/skill-context-report.json

      - name: Test isolated SDD package closure
        run: PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 skills/sdd-implementation/tests/test_isolated_install.py

      - name: Run sdd-implementation tests
        run: PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 -m unittest discover -s skills/sdd-implementation/tests

      - name: Run llm-wiki tests
        run: PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 -m unittest discover -s skills/llm-wiki/tests

      - name: Run decide-in-order tests
        run: PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 -m unittest discover -s skills/decide-in-order/tests

      - name: Run task-management tests
        run: PYTHONPYCACHEPREFIX=/tmp/skills-pycache python3 -m unittest discover -s skills/task-management/tests

      - name: Check diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="${{ github.event.before }}"
          else
            git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
            base_sha="$(git merge-base origin/main HEAD)"
          fi
          git diff --check "${base_sha}..HEAD"

      - name: Upload context report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-context-report-${{ matrix.python-version }}
          path: .artifacts/skill-context-report.json
