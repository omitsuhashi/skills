name: Skill Architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Skill validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate skill architecture
        run: python3 scripts/validate_skill_architecture.py --all
      - name: Test architecture and authoring rules
        run: python3 -m unittest scripts.test_validate_skill_architecture scripts.test_skill_authoring_guidance
      - name: Test Wiki tooling
        run: python3 -m unittest discover -s skills/llm-wiki/tests -p 'test_*.py'
